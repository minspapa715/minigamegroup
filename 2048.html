<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔢 2048</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif; color: #eee;
      touch-action: none;
    }
    .home-btn {
      position: fixed; top: 16px; left: 16px;
      text-decoration: none; color: #aaa;
      background: #16213e; border: 1px solid #333;
      padding: 8px 16px; border-radius: 8px;
      font-size: 0.85rem; transition: color 0.2s;
    }
    .home-btn:hover { color: #fdcb6e; border-color: #fdcb6e; }
    h1 { font-size: 2.2rem; color: #fdcb6e; letter-spacing: 2px; margin-bottom: 14px; }
    .info-bar {
      display: flex; gap: 20px; margin-bottom: 14px;
      background: #16213e; padding: 10px 28px; border-radius: 10px;
    }
    .score-box { text-align: center; }
    .score-box .label { font-size: 0.75rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .score-box .val { font-size: 1.3rem; font-weight: 700; color: #fdcb6e; }
    #board {
      background: #0f3460;
      padding: 10px; border-radius: 12px;
      display: grid; grid-template-columns: repeat(4, 90px);
      grid-template-rows: repeat(4, 90px);
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .tile {
      width: 90px; height: 90px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; font-weight: 800;
      transition: background 0.1s;
    }
    .t0    { background: #16213e; }
    .t2    { background: #2d6a4f; color: #d8f3dc; }
    .t4    { background: #1b7a50; color: #d8f3dc; }
    .t8    { background: #e17055; color: #fff; }
    .t16   { background: #d35400; color: #fff; }
    .t32   { background: #e94560; color: #fff; }
    .t64   { background: #c0392b; color: #fff; }
    .t128  { background: #f9ca24; color: #2d3436; font-size: 1.3rem; }
    .t256  { background: #f0932b; color: #fff; font-size: 1.3rem; }
    .t512  { background: #6c5ce7; color: #fff; font-size: 1.3rem; }
    .t1024 { background: #a29bfe; color: #fff; font-size: 1.1rem; }
    .t2048 { background: #fdcb6e; color: #2d3436; font-size: 1.1rem; }
    .t-big { background: #e84393; color: #fff; font-size: 0.95rem; }
    #message {
      margin-top: 14px; font-size: 1.2rem; font-weight: bold;
      color: #ffeaa7; min-height: 28px; text-align: center;
    }
    .btn {
      margin-top: 12px; padding: 10px 28px; border: none;
      border-radius: 8px; background: #fdcb6e; color: #1a1a2e;
      font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .hint { margin-top: 10px; color: #666; font-size: 0.85rem; }
  </style>
</head>
<body>
  <a class="home-btn" href="index.html">← 홈</a>
  <h1>🔢 2048</h1>
  <div class="info-bar">
    <div class="score-box"><div class="label">점수</div><div class="val" id="score">0</div></div>
    <div class="score-box"><div class="label">최고</div><div class="val" id="best">0</div></div>
  </div>
  <div id="board"></div>
  <div id="message"></div>
  <button class="btn" onclick="initGame()">새 게임</button>
  <div class="hint">방향키 또는 스와이프로 이동</div>

  <script>
    let grid, score, best, won, over;
    best = 0;

    function initGame() {
      grid = Array.from({length: 4}, () => Array(4).fill(0));
      score = 0; won = false; over = false;
      addTile(); addTile();
      document.getElementById('message').textContent = '';
      render();
    }

    function addTile() {
      const empty = [];
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++)
        if (grid[r][c] === 0) empty.push([r, c]);
      if (!empty.length) return;
      const [r, c] = empty[Math.floor(Math.random() * empty.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      grid.forEach(row => row.forEach(val => {
        const div = document.createElement('div');
        div.className = 'tile ' + tileClass(val);
        div.textContent = val || '';
        board.appendChild(div);
      }));
      document.getElementById('score').textContent = score;
      document.getElementById('best').textContent = best;
    }

    function tileClass(v) {
      if (!v) return 't0';
      if (v <= 2048) return 't' + v;
      return 't-big';
    }

    function slide(row) {
      let arr = row.filter(v => v);
      let gained = 0;
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i+1]) {
          arr[i] *= 2; gained += arr[i]; arr[i+1] = 0;
        }
      }
      arr = arr.filter(v => v);
      while (arr.length < 4) arr.push(0);
      return {row: arr, gained};
    }

    function move(dir) {
      if (over) return;
      let moved = false;
      let totalGained = 0;
      const G = grid.map(r => [...r]);

      if (dir === 'left' || dir === 'right') {
        for (let r = 0; r < 4; r++) {
          const row = dir === 'right' ? [...G[r]].reverse() : [...G[r]];
          const {row: slid, gained} = slide(row);
          const result = dir === 'right' ? slid.reverse() : slid;
          if (result.join() !== G[r].join()) moved = true;
          grid[r] = result; totalGained += gained;
        }
      } else {
        for (let c = 0; c < 4; c++) {
          const col = G.map(r => r[c]);
          const row = dir === 'down' ? [...col].reverse() : [...col];
          const {row: slid, gained} = slide(row);
          const result = dir === 'down' ? slid.reverse() : slid;
          for (let r = 0; r < 4; r++) {
            if (result[r] !== G[r][c]) moved = true;
            grid[r][c] = result[r];
          }
          totalGained += gained;
        }
      }

      if (!moved) return;
      score += totalGained;
      if (score > best) best = score;
      addTile();
      render();
      checkState();
    }

    function checkState() {
      if (!won && grid.some(r => r.includes(2048))) {
        won = true;
        document.getElementById('message').textContent = '🎉 2048 달성! 계속 도전해보세요!';
      }
      if (grid.every(r => r.every(v => v)) && !canMove()) {
        over = true;
        document.getElementById('message').textContent = `😞 더 이상 이동할 수 없습니다. 점수: ${score}`;
      }
    }

    function canMove() {
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
        if (!grid[r][c]) return true;
        if (c < 3 && grid[r][c] === grid[r][c+1]) return true;
        if (r < 3 && grid[r][c] === grid[r+1][c]) return true;
      }
      return false;
    }

    document.addEventListener('keydown', e => {
      const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
      if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
    });

    let touchStart = null;
    document.addEventListener('touchstart', e => { touchStart = e.touches[0]; }, {passive:true});
    document.addEventListener('touchend', e => {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.clientX;
      const dy = e.changedTouches[0].clientY - touchStart.clientY;
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
      else move(dy > 0 ? 'down' : 'up');
      touchStart = null;
    }, {passive:true});

    initGame();
  </script>
</body>
</html>
